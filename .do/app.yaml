# DigitalOcean App Platform Configuration
name: nexora-scraper
region: nyc

services:
  - name: web
    github:
      repo: Arq-soft-emerg-7318/nexora_scrapper
      branch: develop
      deploy_on_push: true
    
    environment_slug: python
    
    envs:
      - key: API_BASE
        value: https://nexora-gyhmeqctccb0b9g9.francecentral-01.azurewebsites.net
        scope: RUN_TIME
      
      - key: API_TOKEN
        value: ${API_TOKEN}
        scope: RUN_TIME
        type: SECRET
      
      - key: AUTHOR_ID
        value: "1"
        scope: RUN_TIME
      
      - key: CATEGORY_ID
        value: "1"
        scope: RUN_TIME
      
      - key: COMMUNITY_ID
        value: "1"
        scope: RUN_TIME
    
    http_port: 8000
    
    instance_count: 1
    instance_size_slug: basic-xxs
    
    routes:
      - path: /
    
    health_check:
      http_path: /
